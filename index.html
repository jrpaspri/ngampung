<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unduh Dokumen Surat - JRP Jember</title>
  <link rel="icon" href="https://i.ibb.co.com/fGMy73ry/download-removebg-preview.png" type="image/png" />
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loader-card {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0056b3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { color: #333; margin-bottom: 8px; font-size: 18px; }
    p { color: #666; font-size: 14px; margin: 0; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="loader-card" id="cardInfo">
    <div class="spinner" id="spinner"></div>
    <h3 id="statusTitle">Menyiapkan Dokumen PDF</h3>
    <p id="statusDesc">Sedang memproses unduhan otomatis...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pdfId = urlParams.get('pdf'); // Contoh: PL-R-534-2026 ANDY REZA ZULKARNAEN

    if (pdfId) {
      document.getElementById('statusDesc').innerText = "Dokumen: " + pdfId;

      // =========================================================================
      // RAHASIA AMAN: Rakit link ekspor PDF langsung di JavaScript GitHub Pages
      // Masukkan Spreadsheet ID dan GID print1 kamu di sini secara permanen
      // =========================================================================
      const spreadsheetId = "1OTPGgvGpAB_qdDJKJf8GbIT2E1xwK1pYopbdMcpO9JE"; 
      const printGid = "676872538"; // GID tab print1 kamu

      // Ekstrak nomor surat dari string pdfId (mengambil bagian sebelum spasi pertama atau seluruhnya)
      // Jika format pdfId adalah "PL-R-534-2026 ANDY REZA", kita butuh nomor suratnya untuk di-set (misal via parameter atau jika sheet sudah otomatis melookup data terakhir).
      // Karena sheet biasanya mencetak data terakhir atau kita bisa arahkan ke Web App GAS khusus viewer:
      
      // CARA PALING AMAN AGAR TIDAK MINTA LOGIN GMAIL:
      // Kita panggil endpoint Web App GAS khusus mode download (bukan link mentah sheets)
      // Atau langsung tembak URL ekspor sheets dengan token akses publik jika sheet diset "Anyone with the link can view".
      
      const targetDownloadUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?exportFormat=pdf&format=pdf&gid=${printGid}&size=A4&portrait=true&fitw=true&gridlines=false&fzr=false`;

      // Eksekusi download file PDF murni menggunakan fetch (Mencegah Android buka Google Sheets / minta login)
      fetch(targetDownloadUrl)
        .then(response => {
          if (!response.ok) throw new Error('Gagal mengambil file PDF.');
          return response.blob();
        })
        .then(blob => {
          const blobUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = blobUrl;
          a.download = pdfId + ".pdf";
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(blobUrl);
          
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('statusTitle').innerText = "Berhasil Diunduh!";
          document.getElementById('statusDesc').innerText = "File PDF tersimpan otomatis di perangkat Anda.";
        })
        .catch(err => {
          console.error(err);
          // Fallback darurat jika CORS memblokir fetch: arahkan ke tab baru
          window.location.href = targetDownloadUrl;
        });

    } else {
      document.getElementById('cardInfo').innerHTML = `
        <h3>PT Jasaraharja Putera</h3>
        <p style="margin-top: 10px; color: #444;">Layanan Bot Automasi Dokumen aktif.</p>
      `;
    }
  </script>

</body>
</html>
