<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unduh Dokumen Surat - JRP Jember</title>
  <link rel="icon" href="https://i.ibb.co.com/fGMy73ry/download-removebg-preview.png" type="image/png" />
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loader-card {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0056b3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h3 { color: #333; margin-bottom: 8px; font-size: 18px; }
    p { color: #666; font-size: 14px; margin: 0; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="loader-card" id="cardInfo">
    <div class="spinner"></div>
    <h3 id="statusTitle">Menyiapkan Dokumen PDF</h3>
    <p id="statusDesc">Sedang memproses unduhan untuk Anda...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pdfId = urlParams.get('pdf'); // Contoh: PL-R-533-2026 ANDY REZA
    const targetUrl = urlParams.get('target'); // Link asli GAS tersembunyi

    if (pdfId && targetUrl) {
      document.getElementById('statusDesc').innerText = "Dokumen: " + decodeURIComponent(pdfId);

      // Ambil file PDF melalui fetch di balik layar agar Android mendownloadnya sebagai file, bukan buka Sheet
      fetch(decodeURIComponent(targetUrl))
        .then(response => {
          if (!response.ok) throw new Error('Gagal mengambil dokumen.');
          return response.blob();
        })
        .then(blob => {
          const blobUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = blobUrl;
          a.download = decodeURIComponent(pdfId) + ".pdf";
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(blobUrl);
          
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('statusTitle').innerText = "Berhasil Diunduh!";
          document.getElementById('statusDesc').innerText = "Silakan cek folder Unduhan/Downloads di perangkat Anda.";
        })
        .catch(err => {
          console.error(err);
          // Fallback jika fetch diblokir CORS oleh Google: Buka langsung via window location
          window.location.replace(decodeURIComponent(targetUrl));
        });

    } else {
      document.getElementById('cardInfo').innerHTML = `
        <h3>PT Jasaraharja Putera</h3>
        <p style="margin-top: 10px; color: #444;">Layanan Bot Automasi Dokumen aktif.</p>
      `;
    }
  </script>

</body>
</html>
